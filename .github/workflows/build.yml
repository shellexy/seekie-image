name: Build

# 推 v* 标签时构建 Linux .deb 和 Windows 安装包，全部成功后才发布到 Releases。
# 手动触发只构建并把产物留在 Actions 里，方便先跑通再发版。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 后端测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 跑测试
        run: python -m unittest discover -s tests -v

  linux:
    name: Linux（deb）
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-webview python3-httpx python3-pil \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            xvfb xauth curl file

      - name: 校验标签与版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' seekie_image/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 __init__.py 的版本 $version 不一致" >&2
            exit 1
          fi

      # deb 走系统 Python 包路线，这里先按 Ubuntu 24.04 的版本（httpx 0.26、
      # pywebview 5.0.5）跑一遍测试，确认依赖声明没有撒谎。
      - name: 系统 Python 包兼容性测试
        run: python3 -m unittest discover -s tests -v

      - name: 构建 deb（纯 Python）
        run: bash packaging/linux/build-deb.sh

      # deb 里的启动器用系统 python3；PYTHONPATH 指向解包出来的 dist-packages，
      # 这样既测到包内容，又确实用系统的 python3-webview / httpx / Pillow。
      - name: 冒烟测试 deb 里的程序
        run: |
          deb="$(ls dist/*.deb)"
          rm -rf "$RUNNER_TEMP/deb"
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          export PYTHONPATH="$RUNNER_TEMP/deb/usr/lib/python3/dist-packages"
          bash packaging/linux/smoke-test.sh "$RUNNER_TEMP/deb/usr/bin/seekie-image"
          bash packaging/linux/native-smoke.sh "$RUNNER_TEMP/deb/usr/bin/seekie-image"

      - name: 按依赖安装 deb
        run: |
          sudo apt-get install -y ./dist/*.deb
          seekie-image --version

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: dist/*.deb

  windows:
    name: Windows（安装包）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: 版本号
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path seekie_image/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") {
            throw "标签与 __init__.py 的版本不一致"
          }

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/seekie-image.spec

      - name: 冒烟测试（浏览器模式）
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "seekie-data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $port = Get-Random -Minimum 20000 -Maximum 40000
          $exe = (Resolve-Path "dist\seekie-image\seekie-image.exe").Path
          $stdout = Join-Path $env:RUNNER_TEMP "seekie-out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "seekie-err.log"
          $p = Start-Process -FilePath $exe -ArgumentList "--browser","--no-open","--port",$port,"--data-dir",$data `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $page = $null
            for ($i = 0; $i -lt 100; $i++) {
              try {
                $page = Invoke-WebRequest -UseBasicParsing -NoProxy "http://127.0.0.1:$port/"
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if ($null -eq $page) { throw "HTTP 服务没起来`n$(Get-Content $stderr -Raw)" }
            if ($page.Content -notmatch 'Seekie Image') { throw "页面标题不对" }
            $second = Start-Process -FilePath $exe -ArgumentList "--browser","--no-open","--data-dir",$data -PassThru -Wait
            if ($second.ExitCode -ne 0) { throw "第二个实例退出码 $($second.ExitCode)" }
            $p.Refresh()
            if ($p.HasExited) { throw "第二个实例把第一个实例挤掉了" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 冒烟测试（原生窗口）
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "seekie-native"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $port = Get-Random -Minimum 20000 -Maximum 40000
          $exe = (Resolve-Path "dist\seekie-image\seekie-image.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--port",$port,"--data-dir",$data -PassThru
          try {
            $up = $false
            for ($i = 0; $i -lt 150; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -NoProxy "http://127.0.0.1:$port/" | Out-Null
                $up = $true
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            Start-Sleep -Seconds 3
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host "--- app.log ---"
              if (Test-Path (Join-Path $data "app.log")) { Get-Content (Join-Path $data "app.log") -Raw }
              throw "原生窗口启动失败：进程已退出，退出码 $($p.ExitCode)"
            }
            if (-not $up) { throw "原生窗口的 HTTP 服务没起来" }
            if (-not $p.MainWindowTitle) { throw "进程还在，但没有主窗口" }
            Write-Host "原生窗口标题：$($p.MainWindowTitle)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 生成安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "packaging\windows\seekie-image.iss"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: dist/*.exe

  release:
    name: 发布到 Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
